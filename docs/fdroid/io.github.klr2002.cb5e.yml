Categories:
  - Game Helper
  - Role-Playing Game
License: GPL-3.0-or-later
AuthorName: KLR2002
SourceCode: https://github.com/KLR2002/dndCharacterBuilder
IssueTracker: https://github.com/KLR2002/dndCharacterBuilder/issues
Changelog: https://github.com/KLR2002/dndCharacterBuilder/releases

AutoName: Character Builder

RepoType: git
Repo: https://github.com/KLR2002/dndCharacterBuilder.git

Builds:
  - versionName: 2.1.1
    versionCode: 201011
    commit: 8e3fe8e72665a36f1c47a5ceb59dd401915ee5eb
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t forky npm
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - sdkmanager "platforms;android-36" "build-tools;36.0.0"
    init: npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sed -i -e '/"versionCode"/s/[0-9][0-9]*/$$VERCODE$$/' app.json
      - CI=1 EXPO_NO_TELEMETRY=1 npx expo prebuild --platform android --no-install
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/@react-native-masked-view/masked-view/android/build.gradle
    scandelete:
      - node_modules
    build:
      - cd android
      - gradle --no-daemon assembleRelease -PreactNativeArchitectures=armeabi-v7a
        -Pfdroid
    ndk: r27b

